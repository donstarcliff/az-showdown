<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A–Z Showdown</title><style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#f4f7fb;font:16px system-ui}main{max-width:760px;margin:40px auto;padding:20px}.panel{background:#1d2a3d;border:1px solid #34445b;border-radius:18px;padding:24px;margin:16px 0}h1{font-size:clamp(34px,7vw,58px);margin:0;color:#64e1d4}h2{margin-top:0}input,select,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #52647b;margin:5px 0;width:100%}button{background:#64e1d4;color:#10202a;font-weight:700;cursor:pointer;border:0}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.hidden{display:none}.letter{font-size:100px;text-align:center;font-weight:900;color:#64e1d4}.muted{color:#b4c2d3}.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #34445b}.code{font-size:30px;letter-spacing:6px;color:#64e1d4}.timer{text-align:center;font-size:30px;font-weight:800}
</style></head><body><main><h1>A–Z Showdown</h1><p class="muted">A real-time party game for 2–8 players. Create a room and invite friends.</p>
<section id="home" class="grid"><div class="panel"><h2>Create a room</h2><input id="hostName" placeholder="Your nickname" maxlength="18"><select id="mode"><option value="classic">Classic A–Z</option><option value="trivia">Trivia Blitz</option><option value="team">Team Battle (preview)</option></select><select id="rounds"><option>5</option><option selected>10</option><option>15</option></select><button id="create">Create room</button></div><div class="panel"><h2>Join a room</h2><input id="joinName" placeholder="Your nickname" maxlength="18"><input id="roomCode" placeholder="Six-character code" maxlength="6"><button id="join">Join room</button></div></section>
<section id="game" class="panel hidden"><div class="row"><div><div class="muted">ROOM CODE</div><div class="code" id="code"></div></div><div id="round"></div></div><div id="lobby"><h2>Players</h2><div id="players"></div><button id="start">Start game (host)</button></div><div id="playing" class="hidden"><div class="letter" id="letter"></div><div id="question"></div><div class="timer" id="timer"></div><div id="answers" class="grid"><input placeholder="Name"><input placeholder="Animal"><input placeholder="Place"><input placeholder="Food"><input placeholder="Thing"></div><div id="options"></div><button id="submit">Submit answers</button><p class="muted" id="status"></p></div><div id="results" class="hidden"><h2>Round results</h2><div id="resultList"></div><button id="next">Next round (host)</button></div><div id="finished" class="hidden"><h2>Game finished</h2><div id="final"></div><button id="rematch">Rematch</button></div></section><p id="toast" class="muted"></p></main>
<script>
let ws,room,me,choice=null,timer;
const $=id=>document.getElementById(id),say=s=>$("toast").textContent=s;
function connect(){return new Promise((ok,no)=>{ws=new WebSocket((location.protocol==="https:"?"wss:":"ws:")+"//"+location.host);ws.onopen=ok;ws.onerror=no;ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="error"){say(m.message);return}if(m.room){room=m.room;me=m.you||me;render(m.type)}}})}
async function act(type,data){try{if(!ws||ws.readyState!==1)await connect();ws.send(JSON.stringify({type,...data}))}catch{say("Could not connect to server.")}}
$("create").onclick=async()=>{await connect();ws.send(JSON.stringify({type:"create",name:$("hostName").value,mode:$("mode").value,totalRounds:$("rounds").value}))};
$("join").onclick=async()=>{await connect();ws.send(JSON.stringify({type:"join",name:$("joinName").value,code:$("roomCode").value.toUpperCase()}))};
$("start").onclick=()=>act("start",{});$("next").onclick=()=>act("next",{});$("rematch").onclick=()=>act("rematch",{});
$("submit").onclick=()=>{if(room.mode==="trivia"){if(choice===null)return say("Choose an option.");act("submit",{answer:choice})}else act("submit",{answers:[...$("answers").querySelectorAll("input")].map(x=>x.value)})};
function render(type){$("home").classList.add("hidden");$("game").classList.remove("hidden");$("code").textContent=room.code;$("round").textContent="Round "+room.round+" / "+room.totalRounds;$("players").innerHTML=room.players.map(p=>'<div class="row"><span>'+esc(p.name)+(p.id===room.hostId?" 👑":"")+'</span><b>'+p.score+' pts</b></div>').join("");$("start").classList.toggle("hidden",me!==room.hostId);
["lobby","playing","results","finished"].forEach(id=>$(id).classList.toggle("hidden",room.status!==({lobby:"lobby",playing:"playing",results:"results",finished:"finished"}[id])));
if(room.status==="playing"){const trivia=room.mode==="trivia";$("letter").textContent=room.letter||"";$("answers").classList.toggle("hidden",trivia);$("question").textContent=room.question?.question||"NAME · ANIMAL · PLACE · FOOD · THING";$("options").innerHTML=trivia?room.question.options.map((o,i)=>'<button data-i="'+i+'">'+esc(o)+'</button>').join(""):"";document.querySelectorAll("[data-i]").forEach(b=>b.onclick=()=>{choice=+b.dataset.i;say("Selected "+b.textContent)});$("submit").disabled=!!room.players.find(p=>p.id===me)?.submitted;clearInterval(timer);const tick=()=>{$("timer").textContent=Math.max(0,Math.ceil((room.deadline-Date.now())/1000))+"s"};tick();timer=setInterval(tick,250)}
if(room.status==="results"){$("resultList").innerHTML=(room.results||[]).map(x=>'<div class="row"><span>'+esc(x.category||"Trivia")+' · '+esc(x.name)+' · '+esc(x.answer)+'</span><b>'+x.points+' pts</b></div>').join("")+$("players").innerHTML;$("next").classList.toggle("hidden",me!==room.hostId)}
if(room.status==="finished"){$("final").innerHTML=$("players").innerHTML;$("rematch").classList.toggle("hidden",me!==room.hostId)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
</script></body></html>
